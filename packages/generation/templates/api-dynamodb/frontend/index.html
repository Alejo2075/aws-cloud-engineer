<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1 id="title">App</h1>
      <p id="status" role="status"></p>

      <section id="auth">
        <form id="signin">
          <h2>Sign in</h2>
          <label>Email <input name="email" type="email" autocomplete="username" required /></label>
          <label
            >Password
            <input name="password" type="password" autocomplete="current-password" required
          /></label>
          <button type="submit">Sign in</button>
          <button type="button" id="show-signup">Create account</button>
        </form>
        <form id="signup" hidden>
          <h2>Create account</h2>
          <label>Email <input name="email" type="email" autocomplete="username" required /></label>
          <label
            >Password (12+ chars, digit, symbol)
            <input name="password" type="password" autocomplete="new-password" minlength="12" required
          /></label>
          <button type="submit">Sign up</button>
        </form>
        <form id="confirm" hidden>
          <h2>Confirm email</h2>
          <label>Code from your email <input name="code" inputmode="numeric" required /></label>
          <button type="submit">Confirm</button>
        </form>
      </section>

      <section id="app" hidden>
        <button type="button" id="signout">Sign out</button>
        <div id="entities"></div>
      </section>
    </main>
    <script src="app.js" type="module"></script>
  </body>
</html>
